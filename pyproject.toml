[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uniconv"
dynamic = ["version"]
description = "Local file converter for macOS: images, PDF, Office, Markdown, audio and video. Nothing leaves your machine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Leon Brzosa" }]
keywords = ["macos", "file-conversion", "converter", "pdf", "heic", "markdown", "privacy", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Utilities",
]
dependencies = [
  "pymupdf",
  "pymupdf4llm",
  "pillow",
  "pillow-heif",
  "markdown",
  "mammoth",
  "html2text",
]

[project.optional-dependencies]
pdf2docx = ["pdf2docx"]
dev = ["pytest", "ruff"]

[project.scripts]
uniconv = "uniconv.cli:main"
uniconv-app = "uniconv.app:main"

[tool.hatch.version]
path = "src/uniconv/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uniconv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
