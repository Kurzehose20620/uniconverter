[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uniconverter"
dynamic = ["version"]
description = "Local file converter for macOS: images, PDF, Office, Markdown, audio and video. Nothing leaves your machine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Leon Brzosa" }]
keywords = ["macos", "file-conversion", "converter", "pdf", "heic", "markdown", "privacy", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Utilities",
]
dependencies = [
  "pymupdf",
  "pymupdf4llm",
  "pillow",
  "pillow-heif",
  "markdown",
  "mammoth",
  "html2text",
  "pywebview",
]

[project.optional-dependencies]
pdf2docx = ["pdf2docx"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/Kurzehose20620/uniconverter"
Repository = "https://github.com/Kurzehose20620/uniconverter"
Changelog = "https://github.com/Kurzehose20620/uniconverter/blob/main/CHANGELOG.md"
Issues = "https://github.com/Kurzehose20620/uniconverter/issues"

[project.scripts]
uniconverter = "uniconverter.cli:main"
uniconverter-app = "uniconverter.app:main"

[tool.hatch.version]
path = "src/uniconverter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uniconverter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
